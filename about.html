<style>
/* About is the off-duty page: a serif voice, and the orange secondary color in motion */
:root{--tape:rgba(240,138,60,.38);--serif:'Fraunces',Georgia,'Times New Roman',serif;--orange-ink:#C4571A}

/* hero */
.ab-hero{position:relative;padding-top:calc(var(--s8) + var(--s6));padding-bottom:var(--s7)}
.ab-eyebrow{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-ink);margin-bottom:var(--s4)}
.ab-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(240,138,60,.5)}50%{transform:scale(1.15);box-shadow:0 0 0 8px rgba(240,138,60,0)}}
.ab-hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,7vw,88px);line-height:1.02;letter-spacing:-.03em;max-width:9.5em;position:relative;z-index:1}
.ab-hero h1 em{font-style:italic;position:relative;white-space:nowrap}
.ab-hero h1 em::after{content:"";position:absolute;left:-2%;right:-2%;bottom:.04em;height:.2em;z-index:-1;background:var(--orange);opacity:.85;border-radius:3px;transform-origin:left;transform:scaleX(0) rotate(-1deg);animation:swipe .9s var(--ease) .8s forwards}
@keyframes swipe{to{transform:scaleX(1) rotate(-1deg)}}
.ab-hero p{font-size:var(--fs-title);line-height:var(--lh-prose);color:var(--body);max-width:30em;margin-top:var(--s5);position:relative;z-index:1}
.w{display:inline-block;opacity:0;transform:translateY(.35em);animation:wd .7s var(--ease) forwards;animation-delay:calc(.1s + var(--i) * .09s)}
@keyframes wd{to{opacity:1;transform:none}}

/* the things I do off the clock */
.loves{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s6);position:relative;z-index:1}
.interest{display:inline-flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4) var(--s2) var(--s3);border:1px solid #D3D8D2;border-radius:var(--r-pill);background:rgba(255,255,255,.55);font-size:var(--fs-ui);line-height:var(--lh-ui);color:var(--body);transition:border-color var(--dur-1),background var(--dur-1),transform var(--dur-2) var(--ease)}
.interest svg{width:20px;height:20px;color:var(--orange-ink);flex-shrink:0;overflow:visible}
.interest:hover{border-color:var(--orange);background:#fff;transform:translateY(-2px)}
.interest.gun svg{color:#C8102E}
.interest.gun:hover{border-color:#C8102E}
/* tiny hover motion per interest */
.interest .peak{transform-origin:12px 4px;transition:transform .5s var(--ease)}
.interest:hover .peak{transform:rotate(-14deg)}
.interest .wheel{transform-box:fill-box;transform-origin:center;transition:transform .8s var(--ease)}
.interest:hover .wheel{transform:rotate(360deg)}
.interest .flag{transform-origin:6px 4px;transition:transform .45s var(--ease)}
.interest:hover .flag{animation:wave .7s ease-in-out 2}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
.interest:hover .ball{animation:bounce .6s var(--ease) 1}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}70%{transform:translateY(0)}85%{transform:translateY(-1.5px)}}

/* a trail profile that draws itself: the long way up, then the downhill */
.trail{display:block;width:100%;height:auto;margin:var(--s8) 0 var(--s7);overflow:visible}
.trail .line{fill:none;stroke:var(--orange-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s cubic-bezier(.4,.1,.2,1)}
.trail.in .line{stroke-dashoffset:0}
.trail .base{stroke:#CBD1CA;stroke-width:1;stroke-dasharray:2 6}
.trail .pin{opacity:0;transition:opacity .4s ease 2.3s}
.trail.in .pin{opacity:1}
.trail text{font-family:var(--mono);font-size:11px;letter-spacing:.08em;fill:var(--faint)}

/* about me */
.ab-bio{font-size:var(--fs-title);line-height:var(--lh-prose);color:var(--body);max-width:34em;margin-top:var(--s5);position:relative;z-index:1}
.ab-rows{margin-top:var(--s7);display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s6);max-width:880px;position:relative;z-index:1}
.ab-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--s4);align-items:start}
.ab-k{font-size:var(--fs-label);line-height:var(--lh-label);letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--orange-ink);padding-top:var(--s1)}
.ab-row .loves{margin-top:0;flex-wrap:wrap}
.ab-hero .ab-line{font-size:var(--fs-title);line-height:var(--lh-prose);color:var(--body);margin-top:0;max-width:34em}
.ab-line b{color:var(--ink);font-weight:600}
.langs{list-style:none;display:flex;flex-wrap:wrap;gap:var(--s2)}
.langs li{padding:var(--s2) var(--s4);border:1px solid #D3D8D2;border-radius:var(--r-pill);background:rgba(255,255,255,.55);font-size:var(--fs-ui);line-height:var(--lh-ui);color:var(--body)}
.interest .note{transform-origin:12px 18px;transition:transform .5s var(--ease)}
.interest:hover .note{transform:rotate(-8deg) translateY(-1px)}
@media(max-width:560px){.ab-row{grid-template-columns:minmax(0,1fr);gap:var(--s2)}.ab-k{padding-top:0}}
@media(prefers-reduced-motion:reduce){.interest .note{transition:none}}

/* photo wall */
.wall{columns:3;column-gap:var(--s6);padding-bottom:var(--s8)}
.snap{break-inside:avoid;margin:0 0 var(--s7);display:block;position:relative;transform:rotate(var(--r,0deg));transition:transform var(--dur-2) var(--ease)}
.snap:nth-child(3n+1){--r:-1.6deg}.snap:nth-child(3n+2){--r:1.2deg}.snap:nth-child(3n){--r:-.6deg}
.snap.drop{opacity:0;transform:translateY(-56px) rotate(calc(var(--r,0deg) * 5))}
.snap.drop.in{opacity:1;transform:rotate(var(--r,0deg));transition:opacity .5s ease,transform .9s cubic-bezier(.34,1.45,.5,1)}
.snap.drop.in:hover,.snap:hover{transform:rotate(0) translateY(-4px) scale(1.015);z-index:2;transition:transform var(--dur-2) var(--ease)}
.snap-card{background:#fff;padding:var(--s3) var(--s3) var(--s4);border-radius:3px;box-shadow:0 10px 24px rgba(60,40,25,.14),0 2px 4px rgba(60,40,25,.08)}
.snap-img{position:relative;display:block;overflow:hidden;background:#E9E5DE;aspect-ratio:var(--ar,3/4)}
.snap.land{--ar:4/3}.snap.sq{--ar:1/1}
.snap-img img,.snap-img video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.snap-img video{display:block;background:#232A26}
.snap:hover .snap-img img,.snap:hover .snap-img video{transform:scale(1.04)}
.snap-img img[hidden]{display:none}
.snap-img .ph-note{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);text-align:center;font-size:var(--fs-small);line-height:var(--lh-small);color:var(--soft);border:1px dashed #CFC8BC;margin:var(--s2)}
.snap-img .ph-note b{font-family:var(--mono);font-size:var(--fs-label);color:var(--orange-ink);font-weight:500}
.snap-img img:not([hidden]) ~ .ph-note{display:none}
.snap figcaption{font-family:var(--serif);font-style:italic;font-size:var(--fs-title);line-height:var(--lh-title);color:var(--body);padding:var(--s3) var(--s1) 0}
.snap figcaption i{display:inline-block;font-family:var(--mono);font-style:normal;font-size:var(--fs-tag);letter-spacing:.08em;color:var(--orange-ink);background:rgba(240,138,60,.16);border-radius:var(--r-pill);padding:1px var(--s2);margin-right:var(--s2);vertical-align:2px}
.snap::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-2deg);background:var(--tape);z-index:1}

@media(max-width:900px){.wall{columns:2;column-gap:var(--s5)}.ab-hero{padding-top:var(--s7)}}
@media(max-width:560px){.wall{columns:1}.snap{--r:0deg!important;max-width:420px;margin-left:auto;margin-right:auto}}
@media(prefers-reduced-motion:reduce){
  .w,.ab-hero h1 em::after,.snap.drop,.snap.drop.in{animation:none;opacity:1;transform:none;transition:none}
  .ab-hero h1 em::after{transform:rotate(-1deg)}
  .snap{transform:rotate(var(--r,0deg))}
  .ab-eyebrow::before{animation:none}
  .interest svg *,.interest svg{animation:none!important;transition:none!important}
  .trail path{animation:none!important;stroke-dashoffset:0!important}
  .snap:hover{transform:rotate(var(--r,0deg))}
}
</style>

<script>
/* photos drop in as they scroll into view */
const snaps = document.querySelectorAll('.snap');
if (!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {
  snaps.forEach(s => s.classList.add('drop'));
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { const d = [...snaps].indexOf(e.target) % 3 * 120; setTimeout(() => e.target.classList.add('in'), d); io.unobserve(e.target); }
  }), { threshold: .15 });
  snaps.forEach(s => io.observe(s));
}

const trail = document.getElementById('trail');
if (trail) {
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) trail.classList.add('in');
  else new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { trail.classList.add('in'); o.disconnect(); } }), { threshold: .6 }).observe(trail);
}

/* the video autoplays (muted, looping) while on screen and rests when it is not */
document.querySelectorAll('.snap video').forEach(v => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) { v.controls = true; return; }
  new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) v.play().catch(() => { v.controls = true; }); else v.pause();
  }), { threshold: .4 }).observe(v);
});
</script>
