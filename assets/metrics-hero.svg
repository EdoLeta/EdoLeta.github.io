<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 540" role="img" aria-label="A conversation scored turn by turn, a metric card with definition, scale and anchors, and results tracked across releases against a quality gate">
  <rect width="1260" height="540" fill="#EFEDE9"/>
  <!-- quiet background shapes -->
  <circle cx="-20" cy="560" r="260" fill="#E8E4DC"/>
  <circle cx="1290" cy="-30" r="230" fill="#E8E4DC"/>
  <circle cx="640" cy="590" r="150" fill="#E8E4DC" opacity=".7"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- section labels -->
    <text x="60" y="76" font-size="13" letter-spacing="1.6" fill="#8A857C">CONVERSATION</text>
    <text x="490" y="76" font-size="13" letter-spacing="1.6" fill="#8A857C">METRIC</text>
    <text x="930" y="76" font-size="13" letter-spacing="1.6" fill="#8A857C">ACROSS RELEASES</text>

    <!-- 1. conversation scored turn by turn -->
    <rect x="200" y="100" width="220" height="62" rx="18" fill="#0F0F0F"/>
    <rect x="224" y="124" width="140" height="8" rx="4" fill="#FFFFFF" opacity=".85"/>
    <rect x="224" y="140" width="96" height="8" rx="4" fill="#FFFFFF" opacity=".5"/>

    <rect x="60" y="184" width="270" height="84" rx="18" fill="#FFFFFF" stroke="#E2DFD9"/>
    <rect x="84" y="208" width="200" height="8" rx="4" fill="#E3E0DA"/>
    <rect x="84" y="226" width="170" height="8" rx="4" fill="#E3E0DA"/>
    <rect x="84" y="244" width="110" height="8" rx="4" fill="#E3E0DA"/>
    <circle cx="372" cy="226" r="17" fill="#FFFFFF" stroke="#4E9A63" stroke-width="2.4"/>
    <path d="M364 226l6 6 11-12" fill="none" stroke="#4E9A63" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="220" y="292" width="200" height="56" rx="18" fill="#0F0F0F"/>
    <rect x="244" y="312" width="120" height="8" rx="4" fill="#FFFFFF" opacity=".85"/>
    <rect x="244" y="328" width="80" height="8" rx="4" fill="#FFFFFF" opacity=".5"/>

    <rect x="60" y="372" width="270" height="84" rx="18" fill="#FFFFFF" stroke="#B4471F" stroke-width="2"/>
    <rect x="84" y="396" width="190" height="8" rx="4" fill="#E3E0DA"/>
    <rect x="84" y="414" width="150" height="8" rx="4" fill="#E3E0DA"/>
    <rect x="84" y="432" width="96" height="8" rx="4" fill="#E3E0DA"/>
    <circle cx="372" cy="414" r="17" fill="#B4471F"/>
    <rect x="370" y="404" width="4" height="12" rx="2" fill="#FFFFFF"/>
    <circle cx="372" cy="424" r="2.4" fill="#FFFFFF"/>

    <!-- connector to the metric -->
    <path d="M430 320C455 320 462 290 486 290" fill="none" stroke="#B9B4A9" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
    <path d="M478 283l10 7-10 7" fill="none" stroke="#B9B4A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. the metric card -->
    <rect x="490" y="100" width="370" height="356" rx="22" fill="#FFFFFF" stroke="#E2DFD9" stroke-width="1.5"/>
    <rect x="522" y="132" width="126" height="12" rx="6" fill="#0F0F0F"/>
    <rect x="750" y="128" width="80" height="20" rx="10" fill="none" stroke="#D8D5D0" stroke-width="1.5"/>
    <text x="522" y="190" font-size="12" letter-spacing="1.4" fill="#8A857C">DEFINITION</text>
    <rect x="522" y="202" width="306" height="7" rx="3.5" fill="#E3E0DA"/>
    <rect x="522" y="218" width="226" height="7" rx="3.5" fill="#E3E0DA"/>
    <text x="522" y="268" font-size="12" letter-spacing="1.4" fill="#8A857C">SCALE</text>
    <line x1="536" y1="296" x2="816" y2="296" stroke="#D8D5D0" stroke-width="2"/>
    <circle cx="536" cy="296" r="11" fill="#fff" stroke="#BDB8AE" stroke-width="2"/>
    <circle cx="606" cy="296" r="11" fill="#fff" stroke="#BDB8AE" stroke-width="2"/>
    <circle cx="676" cy="296" r="11" fill="#fff" stroke="#BDB8AE" stroke-width="2"/>
    <circle cx="746" cy="296" r="11" fill="#B4471F" stroke="#B4471F" stroke-width="2"/>
    <circle cx="816" cy="296" r="11" fill="#fff" stroke="#BDB8AE" stroke-width="2"/>
    <text x="522" y="346" font-size="12" letter-spacing="1.4" fill="#8A857C">ANCHORS</text>
    <rect x="522" y="362" width="146" height="62" rx="12" fill="#F3F1ED"/>
    <rect x="540" y="383" width="86" height="7" rx="3.5" fill="#D9D4CB"/>
    <rect x="540" y="399" width="60" height="7" rx="3.5" fill="#D9D4CB"/>
    <rect x="684" y="362" width="146" height="62" rx="12" fill="#F3F1ED"/>
    <rect x="702" y="383" width="86" height="7" rx="3.5" fill="#D9D4CB"/>
    <rect x="702" y="399" width="60" height="7" rx="3.5" fill="#D9D4CB"/>

    <!-- connector to the results -->
    <path d="M870 278C892 278 900 300 924 300" fill="none" stroke="#B9B4A9" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
    <path d="M916 293l10 7-10 7" fill="none" stroke="#B9B4A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. results across releases, against a gate -->
    <rect x="930" y="100" width="270" height="356" rx="22" fill="#FFFFFF" stroke="#E2DFD9" stroke-width="1.5"/>
    <rect x="958" y="316" width="30" height="64" rx="6" fill="#ECE9E3"/>
    <rect x="1000" y="288" width="30" height="92" rx="6" fill="#ECE9E3"/>
    <rect x="1042" y="268" width="30" height="112" rx="6" fill="#ECE9E3"/>
    <rect x="1084" y="236" width="30" height="144" rx="6" fill="#ECE9E3"/>
    <rect x="1126" y="196" width="30" height="184" rx="6" fill="#ECE9E3"/>
    <line x1="954" y1="380" x2="1176" y2="380" stroke="#D8D5D0" stroke-width="2" stroke-linecap="round"/>
    <line x1="954" y1="252" x2="1176" y2="252" stroke="#B4471F" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/>
    <text x="958" y="241" font-size="12" letter-spacing="1.4" fill="#B4471F">GATE</text>
    <path d="M973 304L1015 276 1057 258 1099 226 1141 188" fill="none" stroke="#0F0F0F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="973" cy="304" r="5" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="2.5"/>
    <circle cx="1015" cy="276" r="5" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="2.5"/>
    <circle cx="1057" cy="258" r="5" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="2.5"/>
    <circle cx="1099" cy="226" r="5" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="2.5"/>
    <circle cx="1141" cy="188" r="8" fill="#B4471F"/>
    <rect x="958" y="408" width="122" height="26" rx="13" fill="#F2F8F3" stroke="#C5DFC8"/>
    <circle cx="975" cy="421" r="4" fill="#4E9A63"/>
    <text x="987" y="425.5" font-size="11.5" letter-spacing="1" fill="#3E6B46">PASSES GATE</text>
  </g>
</svg>
