<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #f4efe2; overflow: hidden; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="position:absolute; inset:0;">
  <x-import component="Stage" from="./animations.jsx" width="1920" height="1080" duration="33" background="#f4efe2" persistKey="kyfarms" hint-size="100%,100%">
    <x-import component="KYFarmsMovie" from="./KYFarmsMovie.jsx" tagline="{{ tagline }}" opening-line="{{ openingLine }}" show-grain="{{ showGrain }}" vignette="{{ vignette }}" show-watermark="{{ showWatermark }}" hint-size="100%,100%"></x-import>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1920, &quot;height&quot;: 1080 },
  &quot;tagline&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Naturally grown. Honestly raised.&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;openingLine&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Where good things grow.&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;showWatermark&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;showGrain&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;vignette&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    return {
      tagline: this.props.tagline ?? 'Naturally grown. Honestly raised.',
      openingLine: this.props.openingLine ?? 'Where good things grow.',
      showGrain: this.props.showGrain ?? true,
      vignette: this.props.vignette ?? true,
      showWatermark: this.props.showWatermark ?? true,
    };
  }
}
</script>
<script>
/* reduced motion: hold a single frame instead of playing */
window.addEventListener("load",function(){setTimeout(function(){if(matchMedia("(prefers-reduced-motion: reduce)").matches&&window.__seek)window.__seek(6);},1500);});
</script>
</body>
</html>
